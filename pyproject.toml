[project]
name = "darwin"
version = "0.1.0"
description = "DARWIN: Defense-Aware Adaptive Penetration Testing Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50.0",
    "networkx>=3.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "pyyaml>=6.0",
    "rich>=13.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["darwin*"]
