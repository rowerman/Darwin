# Chain: "WordPress to K8s via Credential Reuse" (Cross-Chain-2)
# Steps: 7 | Domains: Web → DB → Linux → K8s
# Longest chain — tests LLM multi-step reasoning across 4 domains
name: "WordPress to K8s via Credential Reuse"
chain_id: Cross-Chain-2
steps: 7
domains: [web, db, linux, k8s]
nodes:
