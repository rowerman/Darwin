    scenario: web-03
    description: "WordPress Simple File List RCE"
    flag: "flag{chain3-step1-wp}"
    next_hint: "Extract wp-config.php for database credentials"

  - step: 2
    scenario: db-02
    description: "MySQL UDF Privilege Escalation"
    flag: "flag{chain3-step2-mysql}"
