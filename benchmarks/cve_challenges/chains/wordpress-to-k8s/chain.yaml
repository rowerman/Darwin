  - step: 3
    scenario: lnx-02
    description: "nftables pipapo Kernel Exploit → root"
    flag: "flag{chain3-step3-privesc}"
    next_hint: "From root, find /home/user/.kube/config"

  - step: 4
    scenario: k8s-06
    description: "K8s RBAC Secrets Abuse via discovered kubeconfig"
    flag: "flag{chain3-step4-rbac}"
    next_hint: "Use the SA token to discover high-privilege tokens"

  - step: 5
    scenario: k8s-01
    description: "runC Container Escape → host"
    flag: "flag{chain3-step5-escape-final}"
    next_hint: null
    note: "Requires bare metal K8s"
