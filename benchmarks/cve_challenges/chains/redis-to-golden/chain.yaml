    scenario: db-05
    description: "Redis unauthenticated → write SSH key → initial shell"
    flag: "flag{chain8-step1-redis}"
    next_hint: "SSH into the compromised host and enumerate for privilege escalation"

  - step: 2
    scenario: lnx-04
    description: "vsock UAF kernel exploit → root"
    flag: "flag{chain8-step2-privesc}"
