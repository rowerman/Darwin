    description: "SMB Relay to AD CS ESC8 → machine certificate → domain credentials"
    flag: "flag{chain8-step3-esc8}"
    next_hint: "With domain credentials, enumerate AD for high-value targets"

  - step: 4
    scenario: ad-09
    description: "DCSync → extract KRBTGT hash"
    flag: "flag{chain8-step4-dcsync}"
    next_hint: "With the KRBTGT hash, forge a Golden Ticket"

  - step: 5
    scenario: ad-10
    description: "Golden Ticket → cross-domain Enterprise Admin"
    flag: "flag{chain8-step5-golden-final}"
    next_hint: null
