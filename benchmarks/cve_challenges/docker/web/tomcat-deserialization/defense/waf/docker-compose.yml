services:
  waf:
    build:
      context: ../../../../../../../
      dockerfile: benchmarks/cve_challenges/docker/_defense/WAF.Dockerfile
    ports:
      - "10101:8080"
    environment:
      BACKEND_HOST: tomcat
      BACKEND_PORT: "8080"
    depends_on:
      - tomcat

  # Backend — built from base Dockerfile but NOT exposed to host
  tomcat:
    build:
      context: ../../
      dockerfile: Dockerfile
