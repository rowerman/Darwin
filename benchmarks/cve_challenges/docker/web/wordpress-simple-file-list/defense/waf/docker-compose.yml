services:
  waf:
    build:
      context: ../../../../../../../
      dockerfile: benchmarks/cve_challenges/docker/_defense/WAF.Dockerfile
    ports:
      - "10103:8080"
    environment:
      BACKEND_HOST: wordpress
      BACKEND_PORT: "80"
    depends_on:
      - wordpress

  wordpress:
    extends:
      file: ../../docker-compose.yml
      service: wordpress
    ports: []  # Not directly exposed — only via WAF

  db:
    extends:
      file: ../../docker-compose.yml
      service: db
