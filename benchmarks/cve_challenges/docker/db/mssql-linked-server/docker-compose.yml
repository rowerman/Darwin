services:
  mssql-low:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "10204:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"

  mssql-target:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "10214:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
    volumes:
      - ./flag.txt:/flag.txt:ro
