services:
  ssh-target:
    build:
      context: .
      dockerfile: Dockerfile.ssh
    container_name: db05-ssh
    environment:
      CVE_FLAG: ${CVE_FLAG:-flag{db-05-default}}
    networks:
      - redis-net

  redis:
    image: redis:7.2.4
    container_name: db05-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
