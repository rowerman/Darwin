# MCP Server configurations
# DARWIN connects to all enabled servers at startup via stdio JSON-RPC.
# Prerequisite: sudo apt-get install -y nodejs npm

servers:

  # ── Filesystem ── 读写文件、保存报告、管理 payload ──
  filesystem:
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-filesystem"
      - "/tmp/darwin"
      - "experiment_results"
    env: {}
    enabled: true

  # ── Web Search ── CVE 查询、漏洞公告、WAF 绕过技术搜索 ──
  # 需要免费注册: https://brave.com/search/api/
  brave-search:
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-brave-search"
    env:
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
    enabled: false

  # ── Puppeteer Browser ── JS 执行验证、SPA 页面抓取 ──
  puppeteer:
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-puppeteer"
    env: {}
    enabled: true

  # ── GitHub ── 搜索 PoC、漏洞利用代码 ──
  # 需要 token: https://github.com/settings/tokens
  github:
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    enabled: true

  # ── Memory ── LLM 原生跨会话记忆 (与 CTEG 互补) ──
  memory:
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-memory"
    env: {}
    enabled: true

  # ── Sequential Thinking ── 多步攻击链推理 ──
  sequential-thinking:
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-sequential-thinking"
    env: {}
    enabled: true
