# WAF fingerprint database
# Reference: CHeaT cheat/database/ defense technique JSON format
#           AWE xss_agent/analyzers/filter_detector.py probe approach

# Each WAF entry has: id, family, detection_rules, bypass_hints
# Detection rule types: response_header, response_body, status_code, block_page
# Confidence: 0.0-1.0

wafs:
  - id: "modsecurity_crs"
    family: "ModSecurity"
    category: "signature_based"
    rules:
      - type: response_header
        field: "Server"
        pattern: ".*Mod_Security.*"
        confidence: 0.9
      - type: response_body
        pattern: "ModSecurity"
        confidence: 0.7
      - type: block_page
        patterns:
          - "This error was generated by Mod_Security"
          - "ModSecurity Action: ACCESS_DENIED"
          - "ModSecurity: Access denied"
        confidence: 0.95
      - type: status_code
        value: 406
        confidence: 0.5
    bypass_hints:
      - encoding_mutation
      - parameter_pollution
      - content_type_switch

  - id: "cloudflare"
    family: "Cloudflare"
    category: "cdn_based"
    rules:
      - type: response_header
        field: "cf-ray"
        pattern: ".*"
        confidence: 0.99
      - type: response_header
        field: "server"
        pattern: "cloudflare"
        confidence: 0.95
      - type: status_code
        value: 1020
        confidence: 0.8
    bypass_hints:
      - origin_ip_discovery
      - protocol_downgrade

  - id: "naxsi"
    family: "Naxsi"
    category: "whitelist_based"
    rules:
      - type: block_page
        patterns:
          - "NAXSI_FMT"
          - "NAXSI_EXLOG"
          - "Blocked by NAXSI"
        confidence: 0.95
    bypass_hints:
      - context_specific_mutation
      - case_alternation

  - id: "coraza"
    family: "Coraza"
    category: "signature_based"
    rules:
      - type: response_header
        field: "Server"
        pattern: "coraza"
        confidence: 0.9
      - type: block_page
        patterns:
          - "coraza-wasm"
          - "Coraza: Access Denied"
        confidence: 0.95
    bypass_hints:
      - encoding_mutation
      - request_fragmentation
