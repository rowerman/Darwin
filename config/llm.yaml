# LLM provider configuration
# Reference: Cochise litellm usage pattern

default:
  provider: "openai"  # openai | anthropic | deepseek | ollama
  model: "gpt-4o"
  api_key: "${LLM_API_KEY}"
  base_url: ""  # empty = use provider default
  temperature: 0.7
  max_tokens: 4096

reasoning:
  provider: "anthropic"
  model: "claude-sonnet-4-20250514"
  api_key: "${LLM_API_KEY}"
  temperature: 0.3
  max_tokens: 8192

classifier:
  provider: "openai"
  model: "gpt-5-nano"
  api_key: "${LLM_API_KEY}"
  temperature: 0.1
  max_tokens: 1024
