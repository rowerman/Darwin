# DARWIN main configuration
# Reference: Cochise CLI config pattern

darwin:
  max_iterations: 100
  time_budget_seconds: 600  # 10 minutes per challenge
  token_budget: 200000
  max_context_tokens: 180000
  context_compression_threshold: 0.4  # 40% context load triggers compression
  pass_at_k: 3  # number of attempts per challenge

solo_mode:
  max_recon_steps: 20
  max_exploit_steps: 30
  max_bypass_attempts: 5

defense:
  waf_probe_timeout: 5  # seconds per probe
  llm_classifier_model: "gpt-5-nano"  # cheap model for WAF classification

verification:
  browser_headless: true
  browser_timeout: 10000  # ms
  flag_pattern: "flag\\{[a-zA-Z0-9_\\-]+\\}"
